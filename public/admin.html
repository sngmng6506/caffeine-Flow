<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      gap: 0;
      height: 100vh;
      overflow: hidden;
    }

    /* ── 왼쪽: 플레이어 ── */
    #player-panel {
      width: 420px;
      flex-shrink: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px;
      border-right: 1px solid #222;
    }

    /* LP 애니메이션 */
    .lp-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 24px;
    }
    .lp-disc {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: conic-gradient(
        #1a1a1a 0deg, #2a2a2a 5deg, #1a1a1a 10deg,
        #2a2a2a 15deg, #1a1a1a 20deg, #2a2a2a 25deg,
        #1a1a1a 30deg, #2a2a2a 35deg, #1a1a1a 40deg,
        #2a2a2a 45deg, #1a1a1a 50deg, #2a2a2a 55deg,
        #1a1a1a 0deg
      );
      box-shadow: 0 0 40px #0008, inset 0 0 20px #0006;
      animation: spin 4s linear infinite;
      animation-play-state: paused;
    }
    .lp-disc.playing { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .lp-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #c8a96e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #1a1000;
      letter-spacing: 1px;
      overflow: hidden;
    }
    .lp-label img {
      width: 80px; height: 80px;
      object-fit: cover;
      border-radius: 50%;
    }
    .lp-hole {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #0f0f0f;
      z-index: 2;
    }

    /* 현재 곡 정보 */
    #now-title {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      max-width: 360px;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    #now-channel {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
    }

    /* 컨트롤 버튼 */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-skip   { background: #c8a96e; color: #0f0f0f; }
    .btn-toggle { background: #2a2a2a; color: #f0f0f0; border: 1px solid #444; }
    .btn-toggle.off { background: #3a1a1a; color: #ff6b6b; border-color: #ff6b6b44; }

    /* 숨겨진 YouTube iframe */
    #yt-player {
      width: 360px;
      height: 202px;
      border-radius: 10px;
      border: none;
      background: #000;
    }

    /* ── 오른쪽: 큐 ── */
    #queue-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    #queue-panel h2 {
      font-size: 13px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .queue-item.now-playing {
      background: #1e1a10;
      border: 1px solid #c8a96e44;
    }
    .queue-num {
      width: 28px;
      text-align: center;
      font-size: 13px;
      color: #c8a96e;
      font-weight: 700;
      flex-shrink: 0;
    }
    .queue-item img {
      width: 56px;
      height: 42px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .track-info { flex: 1; overflow: hidden; }
    .track-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-channel { font-size: 11px; color: #888; margin-top: 2px; }
    .delete-btn {
      background: transparent;
      border: 1px solid #444;
      border-radius: 6px;
      color: #888;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .delete-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

    .empty { color: #555; font-size: 13px; padding: 20px 0; }

    /* 상태 표시 */
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      display: inline-block;
      margin-right: 6px;
    }
    #status-dot.off { background: #ff6b6b; }
  </style>
</head>
<body>

<!-- 왼쪽: 플레이어 -->
<div id="player-panel">
  <div class="lp-wrapper">
    <div class="lp-disc" id="lp-disc">
      <div class="lp-label" id="lp-label">MUSIC</div>
      <div class="lp-hole"></div>
    </div>
  </div>

  <div id="now-title">재생 대기 중</div>
  <div id="now-channel"></div>

  <div class="controls">
    <button class="btn btn-skip" id="skip-btn">⏭ 스킵</button>
    <button class="btn btn-toggle" id="toggle-btn">
      <span id="status-dot"></span>시스템 ON
    </button>
  </div>

  <iframe id="yt-player" allow="autoplay"></iframe>
</div>

<!-- 오른쪽: 큐 목록 -->
<div id="queue-panel">
  <h2>신청 목록</h2>
  <div id="queue-list"><div class="empty">신청된 곡이 없습니다</div></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const TOKEN  = params.get('token') || '';

  if (!TOKEN) {
    document.body.innerHTML = '<div style="padding:60px;color:#888">토큰이 필요합니다.</div>';
    throw new Error('No token');
  }

  const socket = io();
  let currentQueue  = [];
  let isSystemOn    = true;
  let isPlaying     = false;

  // ── YouTube IFrame Player API ────────────────────────────
  let ytPlayer = null;

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('yt-player', {
      height: '202',
      width: '360',
      playerVars: { autoplay: 1, controls: 1 },
      events: {
        onStateChange: onPlayerStateChange,
      },
    });
  };

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
      // 곡이 끝나면 자동 스킵
      adminSkip();
    }
    const playing = event.data === YT.PlayerState.PLAYING;
    document.getElementById('lp-disc').classList.toggle('playing', playing);
    isPlaying = playing;
  }

  function loadVideo(videoId) {
    if (!ytPlayer) return;
    ytPlayer.loadVideoById(videoId);
  }

  // ── 소켓 이벤트 ──────────────────────────────────────────
  socket.on('queue_update', ({ queue, isSystemOn: sysOn }) => {
    isSystemOn   = sysOn;
    currentQueue = queue;
    renderQueue(queue);
    updateToggleBtn();

    // 큐 첫 항목이 바뀌었거나 아무것도 안 재생 중이면 재생 시작
    if (queue.length > 0 && !isPlaying) {
      playFirst(queue[0]);
    }
    // 큐가 비면 플레이어 정보 초기화
    if (queue.length === 0) {
      resetPlayer();
    }
  });

  function playFirst(item) {
    document.getElementById('now-title').textContent   = item.title;
    document.getElementById('now-channel').textContent = item.channelTitle;

    const labelEl = document.getElementById('lp-label');
    labelEl.innerHTML = `<img src="${item.thumbnail}" alt="" />`;

    loadVideo(item.videoId);
  }

  function resetPlayer() {
    document.getElementById('now-title').textContent   = '재생 대기 중';
    document.getElementById('now-channel').textContent = '';
    document.getElementById('lp-label').innerHTML      = 'MUSIC';
    document.getElementById('lp-disc').classList.remove('playing');
    isPlaying = false;
    if (ytPlayer) ytPlayer.stopVideo();
  }

  // ── 관리자 액션 ──────────────────────────────────────────
  function adminSkip() {
    socket.emit('admin_skip', { token: TOKEN });
    isPlaying = false; // 다음 queue_update에서 새 곡 재생
  }

  function adminDelete(id) {
    socket.emit('admin_delete', { token: TOKEN, id });
  }

  function adminToggle() {
    socket.emit('admin_toggle', { token: TOKEN });
  }

  document.getElementById('skip-btn').addEventListener('click', adminSkip);
  document.getElementById('toggle-btn').addEventListener('click', adminToggle);

  function updateToggleBtn() {
    const btn = document.getElementById('toggle-btn');
    const dot = document.getElementById('status-dot');
    if (isSystemOn) {
      btn.textContent = '';
      dot.className = '';
      btn.innerHTML = '<span id="status-dot"></span>시스템 ON';
      btn.classList.remove('off');
    } else {
      btn.innerHTML = '<span id="status-dot off"></span>시스템 OFF';
      btn.classList.add('off');
    }
  }

  // ── 큐 렌더링 ─────────────────────────────────────────────
  function renderQueue(queue) {
    const el = document.getElementById('queue-list');
    if (!queue.length) {
      el.innerHTML = '<div class="empty">신청된 곡이 없습니다</div>';
      return;
    }
    el.innerHTML = queue.map((item, i) => `
      <div class="queue-item ${i === 0 ? 'now-playing' : ''}">
        <div class="queue-num">${i === 0 ? '▶' : i + 1}</div>
        <img src="${item.thumbnail}" alt="" />
        <div class="track-info">
          <div class="track-title">${escHtml(item.title)}</div>
          <div class="track-channel">${escHtml(item.channelTitle)}</div>
        </div>
        <button class="delete-btn" data-id="${item.id}">삭제</button>
      </div>
    `).join('');

    el.querySelectorAll('.delete-btn').forEach((btn) => {
      btn.addEventListener('click', () => adminDelete(btn.dataset.id));
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
