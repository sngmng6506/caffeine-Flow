<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Caffeine Flow</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── 왼쪽 패널 ── */
    #left-panel {
      width: 400px;
      flex-shrink: 0;
      background: #111;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 24px;
      gap: 18px;
      overflow-y: auto;
    }

    /* LP 애니메이션 */
    .lp-wrapper { position: relative; width: 200px; height: 200px; }
    .lp-disc {
      width: 200px; height: 200px;
      border-radius: 50%;
      background: conic-gradient(
        #1a1a1a 0deg, #2a2a2a 5deg, #1a1a1a 10deg,
        #2a2a2a 15deg, #1a1a1a 20deg, #2a2a2a 25deg,
        #1a1a1a 30deg, #2a2a2a 35deg, #1a1a1a 40deg,
        #2a2a2a 45deg, #1a1a1a 50deg, #2a2a2a 55deg, #1a1a1a 0deg
      );
      box-shadow: 0 0 40px #0008;
      animation: spin 4s linear infinite;
      animation-play-state: paused;
    }
    .lp-disc.playing { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lp-label {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 76px; height: 76px; border-radius: 50%;
      background: #c8a96e; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: #1a1000; letter-spacing: 1px;
    }
    .lp-label img { width: 76px; height: 76px; object-fit: cover; border-radius: 50%; }
    .lp-hole {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px; border-radius: 50%;
      background: #0f0f0f; z-index: 2;
    }

    #now-title {
      font-size: 15px; font-weight: 600;
      text-align: center; max-width: 340px; line-height: 1.4;
    }
    #now-channel { font-size: 12px; color: #888; }

    /* YouTube 플레이어 */
    #yt-wrap { position: relative; width: 352px; height: 198px; }
    #yt-player, #yt-player iframe {
      width: 352px; height: 198px;
      border-radius: 10px; border: none; background: #000;
    }
    /* 컨트롤 */
    .controls { display: flex; gap: 10px; width: 100%; }
    .btn {
      flex: 1; border: none; border-radius: 8px;
      padding: 11px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-skip   { background: #c8a96e; color: #0f0f0f; }
    .btn-toggle { background: #2a2a2a; color: #f0f0f0; border: 1px solid #444; }
    .btn-toggle.off { background: #3a1a1a; color: #ff6b6b; border-color: #ff6b6b44; }

    /* ── 오른쪽 패널 ── */
    #right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* 탭 */
    .tabs {
      display: flex; gap: 4px;
      border-bottom: 1px solid #222;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .tab-btn {
      background: none; border: none; color: #666;
      font-size: 13px; padding: 14px 14px 12px;
      cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: #c8a96e; border-bottom-color: #c8a96e; }
    .tab-content { display: none; flex: 1; overflow-y: auto; padding: 20px 24px; }
    .tab-content.active { display: block; }

    /* 큐 */
    .queue-item {
      display: flex; align-items: center; gap: 12px;
      background: #1a1a1a; border-radius: 10px;
      padding: 10px; margin-bottom: 8px;
    }
    .queue-item.now-playing { background: #1e1a10; border: 1px solid #c8a96e44; }
    .queue-num { width: 28px; text-align: center; font-size: 13px; color: #c8a96e; font-weight: 700; flex-shrink: 0; }
    .queue-item img { width: 56px; height: 42px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .track-info { flex: 1; overflow: hidden; }
    .track-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-channel { font-size: 11px; color: #888; margin-top: 2px; }
    .delete-btn {
      background: transparent; border: 1px solid #333;
      border-radius: 6px; color: #888;
      padding: 5px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0;
    }
    .delete-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

    /* 통계 */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat-card { background: #1a1a1a; border-radius: 10px; padding: 14px; text-align: center; }
    .stat-num  { font-size: 24px; font-weight: 700; color: #c8a96e; }
    .stat-label { font-size: 11px; color: #888; margin-top: 4px; }
    .section-label { font-size: 11px; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
    .top-song {
      display: flex; align-items: center; gap: 10px;
      background: #1a1a1a; border-radius: 8px;
      padding: 8px 10px; margin-bottom: 6px;
    }
    .top-song img { width: 40px; height: 30px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .top-song .count { font-size: 12px; color: #c8a96e; font-weight: 700; flex-shrink: 0; margin-left: auto; }
    .bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin-bottom: 6px; }
    .bar { flex: 1; background: #c8a96e44; border-radius: 2px 2px 0 0; min-height: 2px; }
    .bar:hover { background: #c8a96e; }
    .bar-labels { display: flex; gap: 3px; margin-bottom: 20px; }
    .bar-label { flex: 1; text-align: center; font-size: 9px; color: #555; }

    /* 이력 */
    .history-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid #1e1e1e;
    }
    .history-item img { width: 40px; height: 30px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .history-time { font-size: 10px; color: #555; margin-top: 2px; }
    .skipped-badge {
      font-size: 10px; background: #3a1a1a; color: #ff6b6b;
      border-radius: 4px; padding: 2px 6px; flex-shrink: 0; margin-left: auto;
    }

    .empty { color: #555; font-size: 13px; padding: 20px 0; }

    /* ── 음악 재생 탭 ── */
    #tab-player {
      display: none; flex-direction: column;
      flex: 1; overflow: hidden; padding: 0;
    }
    #tab-player.active { display: flex; }

    /* 검색 바 */
    #ps-search-bar {
      display: flex; gap: 8px;
      padding: 16px 20px 12px; flex-shrink: 0;
      border-bottom: 1px solid #1e1e1e;
      background: #111;
    }
    #ps-search-bar input {
      flex: 1; background: #1e1e1e; border: 1px solid #333;
      border-radius: 20px; padding: 10px 18px;
      color: #f0f0f0; font-size: 14px; outline: none;
    }
    #ps-search-bar input:focus { border-color: #c8a96e; }
    #ps-search-bar button {
      background: #c8a96e; border: none; border-radius: 20px;
      padding: 10px 20px; color: #0f0f0f;
      font-weight: 600; font-size: 13px; cursor: pointer; flex-shrink: 0;
    }

    /* 메인: 왼쪽 플레이어 + 오른쪽 결과 */
    #ps-body { display: flex; flex: 1; overflow: hidden; }

    /* 플레이어 영역 */
    #ps-player-col {
      width: 440px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid #1e1e1e;
      background: #0f0f0f;
    }
    #ps-player-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: #000;
    }
    #ps-player-wrap iframe, #default-yt-player {
      width: 100%; height: 100%; border: none;
    }
    #ps-now-info { padding: 14px 16px; }
    #ps-now-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
    #ps-now-channel { font-size: 12px; color: #888; margin-top: 4px; }

    /* 검색 결과 영역 */
    #ps-results-col {
      flex: 1; overflow-y: auto; padding: 12px 16px;
    }
    #ps-results-col .ps-empty {
      color: #555; font-size: 14px; padding: 40px 0; text-align: center;
    }
    .ps-card {
      display: flex; gap: 12px; padding: 8px 6px;
      cursor: pointer; border-radius: 8px;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .ps-card:hover { background: #1a1a1a; }
    .ps-card.active { border-color: #c8a96e; background: #1e1a10; }
    .ps-card-thumb {
      position: relative; width: 168px; height: 94px;
      flex-shrink: 0; border-radius: 8px; overflow: hidden;
      background: #1a1a1a;
    }
    .ps-card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ps-card-dur {
      position: absolute; bottom: 4px; right: 4px;
      background: #000c; color: #fff; font-size: 11px;
      padding: 1px 5px; border-radius: 3px; font-weight: 500;
    }
    .ps-card-info { flex: 1; overflow: hidden; padding-top: 2px; }
    .ps-card-title {
      font-size: 14px; font-weight: 500; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .ps-card-channel { font-size: 12px; color: #888; margin-top: 4px; }
    .ps-card-views { font-size: 11px; color: #666; margin-top: 2px; }

    /* ── QR ── */
    .qr-section { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 8px; }
    .qr-url-box {
      background: #1a1a1a; border-radius: 8px;
      padding: 10px 16px; width: 100%; text-align: center;
    }
    .qr-url-text { font-size: 11px; color: #888; word-break: break-all; }
    #qr-canvas-wrap {
      background: #fff; border-radius: 12px;
      padding: 16px; display: inline-block;
    }
    .qr-actions { display: flex; gap: 10px; }
    .qr-btn {
      border: none; border-radius: 8px;
      padding: 10px 24px; font-size: 13px;
      font-weight: 600; cursor: pointer;
      background: #c8a96e; color: #0f0f0f;
    }
    .qr-btn:active { opacity: 0.8; }
    .qr-btn-secondary { background: #2a2a2a; color: #f0f0f0; border: 1px solid #444; }
    .qr-hint { font-size: 12px; color: #555; text-align: center; line-height: 1.7; }

    @media print {
      body > * { display: none !important; }
      #print-area { display: flex !important; }
    }
    #print-area {
      display: none;
      position: fixed; inset: 0;
      background: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px; z-index: 9999;
    }
    #print-area h2 { font-size: 22px; color: #000; }
    #print-area p  { font-size: 13px; color: #555; }
  </style>
</head>
<body>

<!-- 인쇄용 오버레이 -->
<div id="print-area">
  <h2>☕ MUSIC REQUEST</h2>
  <canvas id="print-canvas"></canvas>
  <p id="print-url"></p>
  <p style="font-size:12px;color:#aaa">YouTube URL을 붙여넣어 음악을 신청하세요</p>
</div>

<!-- 왼쪽: 플레이어 -->
<div id="left-panel">
  <div class="lp-wrapper">
    <div class="lp-disc" id="lp-disc">
      <div class="lp-label" id="lp-label">MUSIC</div>
      <div class="lp-hole"></div>
    </div>
  </div>

  <div id="now-title">재생 대기 중</div>
  <div id="now-channel"></div>

  <div id="yt-wrap">
    <div id="yt-player"></div>
  </div>

  <div class="controls">
    <button class="btn btn-skip" id="skip-btn">⏭ 스킵</button>
    <button class="btn btn-toggle" id="toggle-btn">시스템 ON</button>
  </div>
</div>

<!-- 오른쪽: 탭 패널 -->
<div id="right-panel">
  <div class="tabs">
    <button class="tab-btn" data-tab="player">음악 재생</button>
    <button class="tab-btn active" data-tab="queue">신청 목록</button>
    <button class="tab-btn" data-tab="history">이력</button>
    <button class="tab-btn" data-tab="stats">통계</button>
    <button class="tab-btn" data-tab="qr">QR 코드</button>
  </div>

  <!-- 음악 재생 탭: 유튜브 검색 + 임베드 플레이어 -->
  <div id="tab-player" class="tab-content">
    <div id="ps-search-bar">
      <input id="ps-input" type="text" placeholder="유튜브 검색 — 곡명, 아티스트, 분위기..." />
      <button id="ps-btn">검색</button>
    </div>
    <div id="ps-body">
      <div id="ps-player-col">
        <div id="ps-player-wrap">
          <div id="default-yt-player"></div>
        </div>
        <div id="ps-now-info">
          <div id="ps-now-title">검색 후 곡을 선택하세요</div>
          <div id="ps-now-channel"></div>
        </div>
      </div>
      <div id="ps-results-col">
        <div class="ps-empty">곡명이나 아티스트를 검색하면 여기에 결과가 표시됩니다.</div>
      </div>
    </div>
  </div>

  <div id="tab-queue" class="tab-content active">
    <div id="queue-list"><div class="empty">신청된 곡이 없습니다</div></div>
  </div>

  <div id="tab-history" class="tab-content">
    <div id="history-list"><div class="empty">이력이 없습니다</div></div>
  </div>

  <div id="tab-stats" class="tab-content">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="stat-total">-</div><div class="stat-label">전체 신청</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-played">-</div><div class="stat-label">재생 완료</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-skip">-</div><div class="stat-label">스킵률</div></div>
    </div>
    <div class="section-label">시간대별 재생</div>
    <div class="bar-chart" id="bar-chart"></div>
    <div class="bar-labels" id="bar-labels"></div>
    <div class="section-label">TOP 10 신청곡</div>
    <div id="top-songs"></div>
  </div>

  <!-- QR 탭 -->
  <div id="tab-qr" class="tab-content">
    <div class="qr-section">
      <div class="section-label" style="margin-bottom:12px">손님용 QR 코드</div>

      <div class="qr-url-box">
        <span id="qr-url-text" class="qr-url-text"></span>
      </div>

      <div id="qr-canvas-wrap">
        <canvas id="qr-canvas"></canvas>
      </div>

      <div class="qr-actions">
        <button class="qr-btn" id="qr-print-btn">🖨 인쇄</button>
        <button class="qr-btn qr-btn-secondary" id="qr-download-btn">⬇ 저장</button>
      </div>

      <div class="qr-hint">
        카페 테이블에 부착하거나 인쇄해서 사용하세요.<br/>
        손님은 카메라로 스캔 후 URL을 붙여넣어 신청합니다.
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const TOKEN  = params.get('token') || '';

  if (!TOKEN) {
    document.body.innerHTML = '<div style="padding:60px;color:#888">토큰이 필요합니다.</div>';
    throw new Error('No token');
  }

  /** YouTube IFrame API: 부모 페이지 origin과 맞춰야 postMessage 경고가 줄어듦 */
  const YT_PARENT_ORIGIN = window.location.origin;

  const socket    = io();
  let ytPlayer    = null;
  let playerReady = false;
  let isPlaying   = false;
  let pendingSong = null;

  // ── YouTube IFrame API ────────────────────────────────────
  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('yt-player', {
      height: '198', width: '352',
      playerVars: {
        autoplay: 1,
        controls: 1,
        playsinline: 1,
        enablejsapi: 1,
        origin: YT_PARENT_ORIGIN,
      },
      events: {
        onReady: (e) => {
          playerReady = true;
          e.target.unMute();
          e.target.setVolume(100);
          if (pendingSong) { loadAndPlay(pendingSong); pendingSong = null; }
        },
        onStateChange: onPlayerStateChange,
      },
    });
  };

  function onPlayerStateChange(event) {
    const playing = event.data === YT.PlayerState.PLAYING;
    document.getElementById('lp-disc').classList.toggle('playing', playing);
    isPlaying = playing;
    if (event.data === YT.PlayerState.ENDED) {
      socket.emit('song_ended', { token: TOKEN });
    }
  }

  let currentVideoId = null;

  function loadAndPlay(song) {
    if (!playerReady) { pendingSong = song; return; }
    if (currentVideoId === song.videoId) return;
    currentVideoId = song.videoId;
    ytPlayer.loadVideoById(song.videoId);
  }

  // ── 매장음악 ↔ 신청곡 전환 ─────────────────────────────────
  let queueActive = false;

  function pauseDefaultPlayer() {
    try {
      if (defaultPlayer && typeof defaultPlayer.getPlayerState === 'function') {
        defaultPlayer.pauseVideo();
      }
    } catch {}
  }

  function resumeDefaultPlayer() {
    try {
      if (defaultPlayer && typeof defaultPlayer.getPlayerState === 'function') {
        defaultPlayer.playVideo();
      }
    } catch {}
  }

  // ── 소켓 ─────────────────────────────────────────────────
  socket.on('queue_update', ({ queue, isSystemOn, isPlaying: sysPlaying }) => {
    updateToggleBtn(isSystemOn);
    renderQueue(queue);

    const hasQueue = queue.length > 0 && sysPlaying;

    if (hasQueue) {
      if (!queueActive) {
        queueActive = true;
        pauseDefaultPlayer();
      }
      playSong(queue[0]);
    } else {
      const wasActive = queueActive;
      resetPlayer();
      if (wasActive) resumeDefaultPlayer();
    }
  });

  // ── 재생 ─────────────────────────────────────────────────
  function playSong(song) {
    document.getElementById('now-title').textContent   = song.title;
    document.getElementById('now-channel').textContent = song.channelTitle;
    document.getElementById('lp-label').innerHTML = `<img src="${song.thumbnail}" alt="" />`;
    loadAndPlay(song);
  }

  function resetPlayer() {
    isPlaying      = false;
    pendingSong    = null;
    queueActive    = false;
    currentVideoId = null;
    document.getElementById('now-title').textContent   = '재생 대기 중';
    document.getElementById('now-channel').textContent = '';
    document.getElementById('lp-label').innerHTML = 'MUSIC';
    document.getElementById('lp-disc').classList.remove('playing');
    if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
  }

  // ── 컨트롤 ────────────────────────────────────────────────
  document.getElementById('skip-btn').addEventListener('click', () => {
    isPlaying = false;
    socket.emit('admin_skip', { token: TOKEN });
  });

  document.getElementById('toggle-btn').addEventListener('click', () => {
    socket.emit('admin_toggle', { token: TOKEN });
  });

  function updateToggleBtn(on) {
    const btn = document.getElementById('toggle-btn');
    btn.textContent = on ? '시스템 ON' : '시스템 OFF';
    btn.className   = 'btn btn-toggle' + (on ? '' : ' off');
  }

  // ── 큐 렌더링 ─────────────────────────────────────────────
  function renderQueue(queue) {
    const el = document.getElementById('queue-list');
    if (!queue.length) { el.innerHTML = '<div class="empty">신청된 곡이 없습니다</div>'; return; }
    el.innerHTML = queue.map((item, i) => `
      <div class="queue-item ${i === 0 ? 'now-playing' : ''}">
        <div class="queue-num">${i === 0 ? '▶' : i + 1}</div>
        <img src="${item.thumbnail}" alt="" />
        <div class="track-info">
          <div class="track-title">${escHtml(item.title)}</div>
          <div class="track-channel">${escHtml(item.channelTitle)}</div>
        </div>
        <button class="delete-btn" data-id="${item.id}">삭제</button>
      </div>
    `).join('');
    el.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        isPlaying = false;
        socket.emit('admin_delete', { token: TOKEN, id: btn.dataset.id });
      });
    });
  }

  // ── 탭 ────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'history') loadHistory();
      if (btn.dataset.tab === 'stats')   loadStats();
      if (btn.dataset.tab === 'qr')      initQR();
      if (btn.dataset.tab === 'player')  initDefaultPlayer();
    });
  });

  // ── 이력 ─────────────────────────────────────────────────
  async function loadHistory() {
    const res  = await fetch(`/api/history?token=${TOKEN}&limit=100`);
    const data = await res.json();
    const el   = document.getElementById('history-list');
    if (!data.length) { el.innerHTML = '<div class="empty">이력이 없습니다</div>'; return; }
    el.innerHTML = data.map(item => `
      <div class="history-item">
        <img src="${item.thumbnail}" alt="" />
        <div style="flex:1;overflow:hidden">
          <div class="track-title">${escHtml(item.title)}</div>
          <div class="history-time">${new Date(item.playedAt).toLocaleString('ko-KR')}</div>
        </div>
        ${item.skipped ? '<span class="skipped-badge">스킵</span>' : ''}
      </div>
    `).join('');
  }

  // ── 통계 ─────────────────────────────────────────────────
  async function loadStats() {
    const res  = await fetch(`/api/stats?token=${TOKEN}`);
    const data = await res.json();
    document.getElementById('stat-total').textContent  = data.total;
    document.getElementById('stat-played').textContent = data.played;
    document.getElementById('stat-skip').textContent   = data.skipRate + '%';

    const max = Math.max(...data.byHour, 1);
    document.getElementById('bar-chart').innerHTML = data.byHour
      .map(v => `<div class="bar" style="height:${Math.round((v / max) * 100)}%" title="${v}회"></div>`)
      .join('');
    document.getElementById('bar-labels').innerHTML = data.byHour
      .map((_, i) => `<div class="bar-label">${i % 4 === 0 ? i : ''}</div>`)
      .join('');

    const topEl = document.getElementById('top-songs');
    if (!data.topSongs.length) { topEl.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
    topEl.innerHTML = data.topSongs.map((s, i) => `
      <div class="top-song">
        <span style="color:#555;font-size:12px;width:16px">${i + 1}</span>
        <img src="${s.thumbnail}" alt="" />
        <div style="flex:1;overflow:hidden">
          <div class="track-title">${escHtml(s.title)}</div>
          <div class="track-channel" style="font-size:11px;color:#888">${escHtml(s.channelTitle)}</div>
        </div>
        <span class="count">${s.count}회</span>
      </div>
    `).join('');
  }


  // ── 음악 재생 탭: 유튜브 검색 + 임베드 플레이어 ──────────
  let defaultPlayer     = null;
  let defaultReady      = false;
  let defaultPlayerInit = false;

  function formatViews(n) {
    if (!n) return '';
    if (n >= 100000000) return Math.floor(n / 100000000) + '억회';
    if (n >= 10000) return Math.floor(n / 10000) + '만회';
    if (n >= 1000) return Math.floor(n / 1000) + '천회';
    return n + '회';
  }

  function initDefaultPlayer() {
    if (defaultPlayerInit) return;
    defaultPlayerInit = true;

    defaultPlayer = new YT.Player('default-yt-player', {
      height: '100%', width: '100%',
      playerVars: {
        autoplay: 0, controls: 1, playsinline: 1,
        enablejsapi: 1, origin: YT_PARENT_ORIGIN,
      },
      events: {
        onReady: (e) => {
          defaultReady = true;
          e.target.unMute();
          e.target.setVolume(100);
        },
      },
    });

    const psInput = document.getElementById('ps-input');
    const psBtn   = document.getElementById('ps-btn');
    psBtn.addEventListener('click', psSearch);
    psInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') psSearch(); });
  }

  function playInDefault(track) {
    document.getElementById('ps-now-title').textContent   = track.title;
    document.getElementById('ps-now-channel').textContent = track.channelTitle;
    if (!defaultReady) return;
    defaultPlayer.loadVideoById(track.videoId);
  }

  async function psSearch() {
    const q = document.getElementById('ps-input').value.trim();
    if (!q) return;
    const col = document.getElementById('ps-results-col');
    col.innerHTML = '<div class="ps-empty">검색 중...</div>';

    try {
      const res  = await fetch(`/api/search?token=${TOKEN}&q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (res.status === 429) { col.innerHTML = '<div class="ps-empty">요청이 너무 많습니다. 잠시 후 다시 시도해주세요.</div>'; return; }
      if (!Array.isArray(data) || !data.length) { col.innerHTML = '<div class="ps-empty">결과 없음</div>'; return; }

      col.innerHTML = '';
      data.forEach((track) => {
        const card = document.createElement('div');
        card.className = 'ps-card';
        card.innerHTML = `
          <div class="ps-card-thumb">
            <img src="${track.thumbnail}" alt="" />
            ${track.duration ? `<span class="ps-card-dur">${escHtml(track.duration)}</span>` : ''}
          </div>
          <div class="ps-card-info">
            <div class="ps-card-title">${escHtml(track.title)}</div>
            <div class="ps-card-channel">${escHtml(track.channelTitle)}</div>
            ${track.views ? `<div class="ps-card-views">${formatViews(track.views)}</div>` : ''}
          </div>`;
        card.addEventListener('click', () => {
          col.querySelectorAll('.ps-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          playInDefault(track);
        });
        col.appendChild(card);
      });
    } catch {
      col.innerHTML = '<div class="ps-empty">검색 실패 — 잠시 후 다시 시도해주세요.</div>';
    }
  }

  // ── QR 코드 ──────────────────────────────────────────────
  let qrInitialized = false;

  function initQR() {
    if (qrInitialized) return;
    if (typeof QRCode === 'undefined') {
      setTimeout(initQR, 200);
      return;
    }
    qrInitialized = true;

    const customerUrl = `${location.origin}/customer.html?token=${TOKEN}`;
    document.getElementById('qr-url-text').textContent = customerUrl;

    QRCode.toCanvas(
      document.getElementById('qr-canvas'),
      customerUrl,
      { width: 220, margin: 2, color: { dark: '#000', light: '#fff' } }
    );

    // 인쇄용 캔버스도 생성
    QRCode.toCanvas(
      document.getElementById('print-canvas'),
      customerUrl,
      { width: 280, margin: 2, color: { dark: '#000', light: '#fff' } }
    );
    document.getElementById('print-url').textContent = customerUrl;

    document.getElementById('qr-print-btn').addEventListener('click', () => {
      document.getElementById('print-area').style.display = 'flex';
      window.print();
      document.getElementById('print-area').style.display = 'none';
    });

    document.getElementById('qr-download-btn').addEventListener('click', () => {
      const canvas = document.getElementById('qr-canvas');
      const a = document.createElement('a');
      a.href     = canvas.toDataURL('image/png');
      a.download = 'caffeine-flow-qr.png';
      a.click();
    });
  }
</script>
<script src="/utils.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</body>
