<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Caffeine Flow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── 왼쪽 패널 ── */
    #left-panel {
      width: 380px;
      flex-shrink: 0;
      background: #111;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px;
      gap: 20px;
    }

    /* 익스텐션 상태 */
    #ext-status {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #555;
    }
    .status-dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf5088; }
    .status-dot.disconnected { background: #ff6b6b; }
    #ext-status-text { color: #aaa; }

    /* LP 애니메이션 */
    .lp-wrapper {
      position: relative;
      width: 200px; height: 200px;
    }
    .lp-disc {
      width: 200px; height: 200px;
      border-radius: 50%;
      background: conic-gradient(
        #1a1a1a 0deg, #2a2a2a 5deg, #1a1a1a 10deg,
        #2a2a2a 15deg, #1a1a1a 20deg, #2a2a2a 25deg,
        #1a1a1a 30deg, #2a2a2a 35deg, #1a1a1a 40deg,
        #2a2a2a 45deg, #1a1a1a 50deg, #2a2a2a 55deg, #1a1a1a 0deg
      );
      box-shadow: 0 0 40px #0008;
      animation: spin 4s linear infinite;
      animation-play-state: paused;
    }
    .lp-disc.playing { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lp-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 76px; height: 76px;
      border-radius: 50%;
      background: #c8a96e;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #1a1000;
      letter-spacing: 1px;
    }
    .lp-label img { width: 76px; height: 76px; object-fit: cover; border-radius: 50%; }
    .lp-hole {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #0f0f0f;
      z-index: 2;
    }

    /* 현재 곡 정보 */
    #now-title {
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      max-width: 320px;
      line-height: 1.4;
    }
    #now-channel { font-size: 12px; color: #888; }

    /* 컨트롤 */
    .controls { display: flex; gap: 10px; width: 100%; }
    .btn {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-skip { background: #c8a96e; color: #0f0f0f; }
    .btn-toggle { background: #2a2a2a; color: #f0f0f0; border: 1px solid #444; }
    .btn-toggle.off { background: #3a1a1a; color: #ff6b6b; border-color: #ff6b6b44; }

    /* 익스텐션 미연결 안내 */
    #ext-guide {
      display: none;
      width: 100%;
      background: #1a1500;
      border: 1px solid #c8a96e44;
      border-radius: 10px;
      padding: 14px;
      font-size: 12px;
      color: #c8a96e;
      line-height: 1.7;
      text-align: center;
    }

    /* ── 오른쪽: 큐 ── */
    #queue-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    #queue-panel h2 {
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .queue-item.now-playing {
      background: #1e1a10;
      border: 1px solid #c8a96e44;
    }
    .queue-num {
      width: 28px;
      text-align: center;
      font-size: 13px;
      color: #c8a96e;
      font-weight: 700;
      flex-shrink: 0;
    }
    .queue-item img {
      width: 56px; height: 42px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .track-info { flex: 1; overflow: hidden; }
    .track-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-channel { font-size: 11px; color: #888; margin-top: 2px; }
    .delete-btn {
      background: transparent;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .delete-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }
    .empty { color: #555; font-size: 13px; padding: 20px 0; }

    /* ── 탭 ── */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 1px solid #222;
      padding-bottom: 0;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 13px;
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn.active { color: #c8a96e; border-bottom-color: #c8a96e; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── 통계 ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .stat-num  { font-size: 24px; font-weight: 700; color: #c8a96e; }
    .stat-label { font-size: 11px; color: #888; margin-top: 4px; }

    .section-label {
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .top-song {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }
    .top-song img { width: 40px; height: 30px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .top-song .track-title { font-size: 12px; }
    .top-song .count { font-size: 12px; color: #c8a96e; font-weight: 700; flex-shrink: 0; margin-left: auto; }

    .bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin-bottom: 6px; }
    .bar {
      flex: 1;
      background: #c8a96e44;
      border-radius: 2px 2px 0 0;
      min-height: 2px;
      transition: background 0.2s;
    }
    .bar:hover { background: #c8a96e; }
    .bar-labels { display: flex; gap: 3px; }
    .bar-label { flex: 1; text-align: center; font-size: 9px; color: #555; }

    /* ── 이력 ── */
    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #1e1e1e;
    }
    .history-item img { width: 40px; height: 30px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .history-item .track-title { font-size: 12px; }
    .history-time { font-size: 10px; color: #555; margin-top: 2px; }
    .skipped-badge {
      font-size: 10px;
      background: #3a1a1a;
      color: #ff6b6b;
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
      margin-left: auto;
    }
  </style>
</head>
<body>

<!-- 왼쪽 -->
<div id="left-panel">

  <!-- 익스텐션 연결 상태 -->
  <div id="ext-status">
    <div class="status-dot disconnected" id="ext-dot"></div>
    <span id="ext-status-text">익스텐션 연결 대기 중...</span>
  </div>

  <!-- LP -->
  <div class="lp-wrapper">
    <div class="lp-disc" id="lp-disc">
      <div class="lp-label" id="lp-label">MUSIC</div>
      <div class="lp-hole"></div>
    </div>
  </div>

  <div id="now-title">재생 대기 중</div>
  <div id="now-channel"></div>

  <!-- 컨트롤 -->
  <div class="controls">
    <button class="btn btn-skip" id="skip-btn">⏭ 스킵</button>
    <button class="btn btn-toggle" id="toggle-btn">시스템 ON</button>
  </div>

  <!-- 익스텐션 미연결 안내 -->
  <div id="ext-guide">
    크롬 익스텐션이 연결되지 않았습니다.<br/>
    익스텐션을 설치하고 서버에 연결해주세요.
  </div>

</div>

<!-- 오른쪽: 탭 패널 -->
<div id="queue-panel">
  <div class="tabs">
    <button class="tab-btn active" data-tab="queue">신청 목록</button>
    <button class="tab-btn" data-tab="history">이력</button>
    <button class="tab-btn" data-tab="stats">통계</button>
  </div>

  <!-- 큐 탭 -->
  <div id="tab-queue" class="tab-content active">
    <div id="queue-list"><div class="empty">신청된 곡이 없습니다</div></div>
  </div>

  <!-- 이력 탭 -->
  <div id="tab-history" class="tab-content">
    <div id="history-list"><div class="empty">이력이 없습니다</div></div>
  </div>

  <!-- 통계 탭 -->
  <div id="tab-stats" class="tab-content">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="stat-total">-</div><div class="stat-label">전체 신청</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-played">-</div><div class="stat-label">재생 완료</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-skip">-</div><div class="stat-label">스킵률</div></div>
    </div>

    <div class="section-label" style="margin-bottom:8px">시간대별 재생</div>
    <div class="bar-chart" id="bar-chart"></div>
    <div class="bar-labels" id="bar-labels"></div>

    <div class="section-label" style="margin-top:20px;margin-bottom:10px">TOP 10 신청곡</div>
    <div id="top-songs"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const TOKEN  = params.get('token') || '';

  if (!TOKEN) {
    document.body.innerHTML = '<div style="padding:60px;color:#888">토큰이 필요합니다.</div>';
    throw new Error('No token');
  }

  const socket = io();
  let isSystemOn = true;

  socket.on('queue_update', ({ queue, isSystemOn: sysOn, isPlaying, extensionConnected }) => {
    isSystemOn = sysOn;
    updateExtStatus(extensionConnected);
    updateToggleBtn(sysOn);
    updateNowPlaying(queue, isPlaying);
    renderQueue(queue);
  });

  socket.on('extension_status', ({ connected }) => {
    updateExtStatus(connected);
  });

  // ── 익스텐션 상태 표시 ────────────────────────────────────
  function updateExtStatus(connected) {
    const dot    = document.getElementById('ext-dot');
    const text   = document.getElementById('ext-status-text');
    const guide  = document.getElementById('ext-guide');
    dot.className  = 'status-dot ' + (connected ? 'connected' : 'disconnected');
    text.textContent = connected ? '익스텐션 연결됨' : '익스텐션 연결 대기 중...';
    guide.style.display = connected ? 'none' : 'block';
  }

  // ── 현재 재생 곡 ──────────────────────────────────────────
  function updateNowPlaying(queue, isPlaying) {
    const disc = document.getElementById('lp-disc');
    if (queue.length > 0 && isPlaying) {
      const song = queue[0];
      document.getElementById('now-title').textContent   = song.title;
      document.getElementById('now-channel').textContent = song.channelTitle;
      document.getElementById('lp-label').innerHTML = `<img src="${song.thumbnail}" alt="" />`;
      disc.classList.add('playing');
    } else {
      document.getElementById('now-title').textContent   = '재생 대기 중';
      document.getElementById('now-channel').textContent = '';
      document.getElementById('lp-label').innerHTML = 'MUSIC';
      disc.classList.remove('playing');
    }
  }

  // ── 컨트롤 ────────────────────────────────────────────────
  document.getElementById('skip-btn').addEventListener('click', () => {
    socket.emit('admin_skip', { token: TOKEN });
  });

  document.getElementById('toggle-btn').addEventListener('click', () => {
    socket.emit('admin_toggle', { token: TOKEN });
  });

  function updateToggleBtn(on) {
    const btn = document.getElementById('toggle-btn');
    btn.textContent = on ? '시스템 ON' : '시스템 OFF';
    btn.className   = 'btn btn-toggle' + (on ? '' : ' off');
  }

  // ── 큐 렌더링 ─────────────────────────────────────────────
  function renderQueue(queue) {
    const el = document.getElementById('queue-list');
    if (!queue.length) {
      el.innerHTML = '<div class="empty">신청된 곡이 없습니다</div>';
      return;
    }
    el.innerHTML = queue.map((item, i) => `
      <div class="queue-item ${i === 0 ? 'now-playing' : ''}">
        <div class="queue-num">${i === 0 ? '▶' : i + 1}</div>
        <img src="${item.thumbnail}" alt="" />
        <div class="track-info">
          <div class="track-title">${escHtml(item.title)}</div>
          <div class="track-channel">${escHtml(item.channelTitle)}</div>
        </div>
        <button class="delete-btn" data-id="${item.id}">삭제</button>
      </div>
    `).join('');

    el.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        socket.emit('admin_delete', { token: TOKEN, id: btn.dataset.id });
      });
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── 탭 전환 ───────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'history') loadHistory();
      if (btn.dataset.tab === 'stats')   loadStats();
    });
  });

  // ── 이력 로드 ─────────────────────────────────────────────
  async function loadHistory() {
    const res  = await fetch(`/api/history?token=${TOKEN}&limit=100`);
    const data = await res.json();
    const el   = document.getElementById('history-list');

    if (!data.length) { el.innerHTML = '<div class="empty">이력이 없습니다</div>'; return; }

    el.innerHTML = data.map((item) => `
      <div class="history-item">
        <img src="${item.thumbnail}" alt="" />
        <div style="flex:1;overflow:hidden">
          <div class="track-title">${escHtml(item.title)}</div>
          <div class="history-time">${new Date(item.playedAt).toLocaleString('ko-KR')}</div>
        </div>
        ${item.skipped ? '<span class="skipped-badge">스킵</span>' : ''}
      </div>
    `).join('');
  }

  // ── 통계 로드 ─────────────────────────────────────────────
  async function loadStats() {
    const res  = await fetch(`/api/stats?token=${TOKEN}`);
    const data = await res.json();

    document.getElementById('stat-total').textContent  = data.total;
    document.getElementById('stat-played').textContent = data.played;
    document.getElementById('stat-skip').textContent   = data.skipRate + '%';

    // 시간대별 바 차트
    const max = Math.max(...data.byHour, 1);
    document.getElementById('bar-chart').innerHTML = data.byHour
      .map((v) => `<div class="bar" style="height:${Math.round((v / max) * 100)}%" title="${v}회"></div>`)
      .join('');
    document.getElementById('bar-labels').innerHTML = data.byHour
      .map((_, i) => `<div class="bar-label">${i % 4 === 0 ? i : ''}</div>`)
      .join('');

    // TOP 10
    const topEl = document.getElementById('top-songs');
    if (!data.topSongs.length) { topEl.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
    topEl.innerHTML = data.topSongs.map((s, i) => `
      <div class="top-song">
        <span style="color:#555;font-size:12px;width:16px">${i + 1}</span>
        <img src="${s.thumbnail}" alt="" />
        <div style="flex:1;overflow:hidden">
          <div class="track-title">${escHtml(s.title)}</div>
          <div class="track-channel">${escHtml(s.channelTitle)}</div>
        </div>
        <span class="count">${s.count}회</span>
      </div>
    `).join('');
  }
</script>
</body>
</html>
