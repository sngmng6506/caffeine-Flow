<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>음악 신청</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
    }

    header {
      background: #1a1a1a;
      padding: 16px 20px;
      text-align: center;
      border-bottom: 1px solid #2a2a2a;
    }
    header h1 { font-size: 18px; letter-spacing: 2px; color: #c8a96e; }
    header p  { font-size: 12px; color: #888; margin-top: 4px; }

    /* 시스템 OFF 배너 */
    #offline-banner {
      display: none;
      background: #3a1a1a;
      color: #ff6b6b;
      text-align: center;
      padding: 10px;
      font-size: 14px;
    }

    .container { padding: 16px; max-width: 480px; margin: 0 auto; }

    /* 검색 */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .search-box input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
      color: #f0f0f0;
      font-size: 14px;
      outline: none;
    }
    .search-box input:focus { border-color: #c8a96e; }
    .search-box button {
      background: #c8a96e;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      color: #0f0f0f;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .search-box button:active { opacity: 0.8; }

    /* 검색 결과 */
    #search-results .section-title,
    #queue-section .section-title {
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .track-item:active { background: #242424; }
    .track-item img {
      width: 56px;
      height: 42px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .track-info { flex: 1; overflow: hidden; }
    .track-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-channel { font-size: 11px; color: #888; margin-top: 2px; }
    .request-btn {
      background: #c8a96e;
      color: #0f0f0f;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .request-btn:disabled {
      background: #444;
      color: #888;
      cursor: default;
    }

    /* 큐 */
    #queue-section { margin-top: 24px; }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .queue-num {
      width: 24px;
      text-align: center;
      font-size: 12px;
      color: #c8a96e;
      font-weight: 600;
      flex-shrink: 0;
    }
    .queue-item img {
      width: 48px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .queue-item .track-title { font-size: 13px; }
    .now-playing {
      background: #1e1a10 !important;
      border: 1px solid #c8a96e44;
    }
    .now-playing .queue-num { color: #f0c040; }

    /* 토스트 */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2a2a2a;
      color: #f0f0f0;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .loading { text-align: center; padding: 20px; color: #555; font-size: 13px; }
    .empty   { text-align: center; padding: 20px; color: #555; font-size: 13px; }
  </style>
</head>
<body>

<header>
  <h1>♪ MUSIC REQUEST</h1>
  <p>원하는 음악을 신청해보세요</p>
</header>

<div id="offline-banner">신청이 일시적으로 중단되었습니다</div>

<div class="container">
  <div class="search-box">
    <input id="search-input" type="text" placeholder="곡명, 아티스트 검색..." />
    <button id="search-btn">검색</button>
  </div>

  <div id="search-results"></div>

  <div id="queue-section">
    <div class="section-title">현재 신청 목록</div>
    <div id="queue-list"><div class="empty">신청된 곡이 없습니다</div></div>
  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const params  = new URLSearchParams(location.search);
  const TOKEN   = params.get('token') || '';

  if (!TOKEN) {
    document.body.innerHTML = '<div style="text-align:center;padding:60px;color:#888">유효하지 않은 접근입니다.<br>QR 코드를 다시 스캔해주세요.</div>';
    throw new Error('No token');
  }

  const socket = io();
  let isSystemOn = true;

  // ── 소켓 이벤트 ──────────────────────────────────────────
  socket.on('queue_update', ({ queue, isSystemOn: sysOn }) => {
    isSystemOn = sysOn;
    document.getElementById('offline-banner').style.display = sysOn ? 'none' : 'block';
    renderQueue(queue);
  });

  // ── 검색 ─────────────────────────────────────────────────
  const searchInput = document.getElementById('search-input');
  const searchBtn   = document.getElementById('search-btn');

  searchBtn.addEventListener('click', doSearch);
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;

    const resultsEl = document.getElementById('search-results');
    resultsEl.innerHTML = '<div class="loading">검색 중...</div>';

    try {
      const res  = await fetch(`/api/search?token=${TOKEN}&q=${encodeURIComponent(q)}`);
      const data = await res.json();

      if (!res.ok) throw new Error(data.error);

      if (!data.length) {
        resultsEl.innerHTML = '<div class="empty">검색 결과가 없습니다</div>';
        return;
      }

      resultsEl.innerHTML = `<div class="section-title">검색 결과</div>`;
      data.forEach((track) => {
        const el = document.createElement('div');
        el.className = 'track-item';
        el.innerHTML = `
          <img src="${track.thumbnail}" alt="" />
          <div class="track-info">
            <div class="track-title">${escHtml(track.title)}</div>
            <div class="track-channel">${escHtml(track.channelTitle)}</div>
          </div>
          <button class="request-btn">신청</button>
        `;
        el.querySelector('.request-btn').addEventListener('click', () => requestSong(track, el));
        resultsEl.appendChild(el);
      });
    } catch (err) {
      resultsEl.innerHTML = `<div class="empty">오류: ${err.message}</div>`;
    }
  }

  // ── 곡 신청 ───────────────────────────────────────────────
  function requestSong(track, itemEl) {
    if (!isSystemOn) { showToast('현재 신청이 중단되었습니다'); return; }

    socket.emit('request_song', { token: TOKEN, song: track });

    const btn = itemEl.querySelector('.request-btn');
    btn.disabled = true;
    btn.textContent = '신청됨';
    showToast(`"${track.title.substring(0, 20)}..." 신청 완료!`);
  }

  // ── 큐 렌더링 ─────────────────────────────────────────────
  function renderQueue(queue) {
    const el = document.getElementById('queue-list');
    if (!queue.length) {
      el.innerHTML = '<div class="empty">신청된 곡이 없습니다</div>';
      return;
    }
    el.innerHTML = queue.map((item, i) => `
      <div class="queue-item ${i === 0 ? 'now-playing' : ''}">
        <div class="queue-num">${i === 0 ? '▶' : i + 1}</div>
        <img src="${item.thumbnail}" alt="" />
        <div class="track-info">
          <div class="track-title">${escHtml(item.title)}</div>
          <div class="track-channel">${escHtml(item.channelTitle)}</div>
        </div>
      </div>
    `).join('');
  }

  // ── 유틸 ──────────────────────────────────────────────────
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
