<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Caffeine Flow — 운영자 콘솔</title>
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
<link rel="stylesheet" href="/admin-assets/admin.css" />
</head>
<body>

<div id="login">
  <h1>운영자 콘솔</h1>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" />
  <button id="loginBtn">로그인</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Caffeine Flow 운영자 콘솔</h1>
    <nav class='admin-tools'>
      <a class='admin-tool-link' href='/filter-lab'>필터 테스트</a>
      <a class='admin-tool-link' href='/labeling-lab'>음악 라벨링</a>
    </nav>
    <div class="summary" id="summary"></div>
  </header>

  <div class="toolbar">
    <button class="chip on" data-filter="all">전체</button>
    <button class="chip" data-filter="active">활성</button>
    <button class="chip" data-filter="never">미사용</button>
    <button class="chip" data-filter="suspended">정지됨</button>
    <span class="spacer"></span>
    <button class="chip on" data-sort="created_at">신규순</button>
    <button class="chip" data-sort="today_unique_browsers">브라우저순</button>
    <span class="spacer"></span>
    <button class="chip on" data-view="list">리스트</button>
    <button class="chip" data-view="map">지도</button>
    <button class="chip" id="refresh">새로고침</button>
  </div>

  <main>
    <div id="listView">
      <table>
        <thead>
          <tr>
            <th>상태</th><th>카페</th><th>지역</th>
            <th class="num">오늘 QR 접속</th><th class="num">오늘 신청</th>
            <th>마지막 사용</th><th>가입일</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty hidden" id="empty">해당하는 카페가 없습니다</div>
    </div>
    <div id="mapView" class="hidden"><div id="map"></div></div>
    <section id="statsView" class="hidden">
      <div class="detail-header">
        <button class="act" id="statsBack">← 목록</button>
        <div>
          <h2 id="statsTitle">카페 통계</h2>
          <p>매장 신청과 AI 필터 운영 현황</p>
        </div>
      </div>
      <div id="statsContent"></div>
    </section>
  </main>
</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>
<script src="/admin-assets/admin.js"></script>
</body>
</html>
