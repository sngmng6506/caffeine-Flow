<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #f0f0f0;
    }
    h2 {
      font-size: 15px;
      color: #c8a96e;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    /* 연결 상태 */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #222;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .dot.on  { background: #4caf50; box-shadow: 0 0 5px #4caf5088; }
    .dot.off { background: #ff6b6b; }

    /* 설정 폼 */
    label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 7px 10px;
      color: #f0f0f0;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #c8a96e; }

    button {
      width: 100%;
      margin-top: 14px;
      background: #c8a96e;
      border: none;
      border-radius: 7px;
      padding: 9px;
      color: #0f0f0f;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }

    #saved-msg {
      display: none;
      text-align: center;
      font-size: 12px;
      color: #4caf50;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>☕ Caffeine Flow</h2>

  <div id="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">연결 확인 중...</span>
  </div>

  <label>Server URL</label>
  <input id="server-url" type="text" placeholder="http://localhost:3000" />

  <label>Token</label>
  <input id="token" type="text" placeholder="cafe-secret-2024" />

  <button id="save-btn">저장 & 재연결</button>
  <div id="saved-msg">저장되었습니다!</div>

  <script src="popup.js"></script>
</body>
</html>
