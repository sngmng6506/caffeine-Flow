name: Release Desktop App

# owner 데스크톱 앱(Electron)을 태그 push 시 자동으로 빌드·EVS 서명·GitHub Release 발행한다.
# 웹(owner/customer SPA)과 서버는 Railway가 git push로 자동 배포하지만, 데스크톱 앱은
# 설치 바이너리에 구워지는 owner/electron/main.js 등을 포함하므로 별도 릴리즈가 필요하다.
#
# 트리거: v* 태그 (예: v2.5.21) 또는 기존 태그를 지정한 수동 복구 실행.
# 두 경우 모두 태그를 checkout하며 owner/package.json version과 일치해야 한다.
# 필요한 repo secrets: EVS_ACCOUNT_NAME, EVS_PASSWD (CastLabs EVS 계정).
#   GITHUB_TOKEN은 Actions가 자동 주입 — gh CLI가 Release와 자산을 멱등적으로 갱신한다.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '다시 발행할 기존 태그 (예: v2.5.23)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release 생성·자산 업로드에 필요

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: caffeine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            customer/package-lock.json
            owner/package-lock.json
      - name: 태그 · 버전 · 커밋 확인
        shell: bash
        working-directory: owner
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"

          echo "release tag = ${RELEASE_TAG} / package.json = ${PKG_VERSION}"
          if [ "${RELEASE_TAG}" != "${PKG_VERSION}" ]; then
            echo "::error::태그(${RELEASE_TAG})와 owner/package.json 버전(${PKG_VERSION})이 다릅니다."
            exit 1
          fi
          if [ "${HEAD_COMMIT}" != "${TAG_COMMIT}" ]; then
            echo "::error::checkout 커밋(${HEAD_COMMIT})이 태그 커밋(${TAG_COMMIT})과 다릅니다."
            exit 1
          fi
      - name: 서버 검증
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:test@localhost:5432/caffeine_test
          JWT_SECRET: release-verification-secret-000000000000
        run: npm ci && npm test
      - name: 손님 앱 검증
        working-directory: customer
        run: npm ci && npm run build
      - name: 사장님 앱 검증
        working-directory: owner
        run: npm ci && npm run build

  release:
    needs: verify
    # Widevine(wvcus) + NSIS 인스톨러 + signtool 대상이 Windows이므로 windows 러너에서 빌드한다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: owner/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # CastLabs EVS — Widevine VMP 서명(Spotify 재생용). 비대화형 로그인.
      - name: CastLabs EVS 설치
        run: python -m pip install --upgrade castlabs-evs

      - name: EVS 로그인 (비대화형)
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: python -m castlabs_evs.account --no-ask reauth

      - name: owner 의존성 설치
        working-directory: owner
        run: npm ci

      # electron-builder는 빌드·서명·업데이트 메타데이터 생성까지만 담당한다.
      # Release 생성과 자산 교체를 gh CLI 한 단계로 직렬화해 동시 생성 경합을 막는다.
      - name: 빌드 · 서명
        working-directory: owner
        run: npm run electron:build -- --publish never

      - name: 릴리스 자산 확인
        shell: bash
        run: |
          shopt -s nullglob
          INSTALLERS=(owner/dist/*.exe)
          BLOCKMAPS=(owner/dist/*.exe.blockmap)

          if [ "${#INSTALLERS[@]}" -ne 1 ]; then
            echo "::error::설치 파일은 정확히 1개여야 합니다. 발견: ${#INSTALLERS[@]}"
            exit 1
          fi
          if [ "${#BLOCKMAPS[@]}" -ne 1 ]; then
            echo "::error::blockmap은 정확히 1개여야 합니다. 발견: ${#BLOCKMAPS[@]}"
            exit 1
          fi
          if [ ! -f owner/dist/latest.yml ]; then
            echo "::error::자동 업데이트 메타데이터(owner/dist/latest.yml)가 없습니다."
            exit 1
          fi

      - name: GitHub Release 발행
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

          gh release upload "${RELEASE_TAG}" \
            owner/dist/*.exe \
            owner/dist/*.exe.blockmap \
            owner/dist/latest.yml \
            --clobber

          if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')" = 'true' ]; then
            gh release edit "${RELEASE_TAG}" --draft=false
          fi
