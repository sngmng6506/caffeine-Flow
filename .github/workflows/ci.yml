name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: caffeine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Lint
        run: npm run lint
        working-directory: server
      # 운영자 화면은 브라우저에서 돌아 server 설정의 기준 경로 밖이다.
      # 린트 대상이 아니던 시절 `advanceAfterReview` 미정의가 배포까지 갔다.
      - name: Install lab lint deps
        run: npm ci
      - name: Lint operator labs
        run: npm run lint:labs
      - name: Unit + integration tests
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:test@localhost:5432/caffeine_test
          JWT_SECRET: ci-only-secret-not-used-in-runtime-0000

  audio-worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 테스트는 모델 예측기와 다운로더를 주입해 돌리므로 essentia와 모델 파일이
      # 필요 없다. 무거운 TensorFlow 휠을 끌어오지 않도록 테스트에 필요한 패키지만
      # 고르되, 버전은 requirements.txt에서 그대로 읽는다. 여기에 버전을 다시 적으면
      # 두 곳이 어긋나 CI만 초록인 상태가 된다.
      - name: Install test deps
        run: python -m pip install $(grep -E '^(numpy|Jinja2)' requirements.txt | tr '\n' ' ')
        working-directory: audio-analysis-worker
      - name: Unit tests
        run: python -m unittest discover -s audio-analysis-worker -p 'test_*.py' -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            customer/package-lock.json
            owner/package-lock.json
      - name: Install customer deps
        run: npm ci
        working-directory: customer
      - name: Customer lint
        run: npm run lint
        working-directory: customer
      - name: Customer tests
        run: npm test
        working-directory: customer
      - name: Build customer
        run: npm run build
        working-directory: customer
      - name: Install owner deps
        run: npm ci
        working-directory: owner
      - name: Owner lint
        run: npm run lint
        working-directory: owner
      - name: Owner tests
        run: npm test
        working-directory: owner
      - name: Build owner
        run: npm run build
        working-directory: owner
