name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Syntax check (routes/services/utils)
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: server
      - name: Unit tests
        run: npm test
        working-directory: server
        env:
          # 테스트는 DB에 연결하지 않지만 config.js가 존재 자체를 검증함
          DATABASE_URL: postgres://ci-placeholder
          JWT_SECRET: ci-only-secret-not-used-in-runtime-0000
